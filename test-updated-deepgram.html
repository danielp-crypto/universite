<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Updated Deepgram Service Test</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-8">
  <div class="max-w-2xl mx-auto">
    <h1 class="text-2xl font-bold mb-6">Updated Deepgram Service Test</h1>
    
    <div class="bg-white rounded-lg shadow p-6">
      <div class="mb-4">
        <button id="test-connection-btn" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
          Test Deepgram Connection
        </button>
        <button id="test-transcription-btn" class="bg-purple-600 text-white px-4 py-2 rounded hover:bg-purple-700 ml-2">
          Test Transcription
        </button>
      </div>
      
      <div id="results" class="space-y-4">
        <div id="status" class="hidden p-4 rounded"></div>
        <div id="details" class="hidden bg-gray-50 p-4 rounded font-mono text-sm"></div>
      </div>
    </div>

    <!-- Audio Recording Test -->
    <div class="bg-white rounded-lg shadow p-6 mt-6">
      <h2 class="text-lg font-semibold mb-4">Live Recording Test</h2>
      
      <div class="mb-4">
        <button id="start-record-btn" class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700">
          Start Recording
        </button>
        <button id="stop-record-btn" class="bg-gray-600 text-white px-4 py-2 rounded hover:bg-gray-700 ml-2" disabled>
          Stop Recording
        </button>
      </div>
      
      <div id="recording-status" class="mb-4"></div>
      <div id="transcription-result" class="hidden p-4 rounded"></div>
    </div>
  </div>

  <!-- Include the updated DeepgramService -->
  <script src="js/config.js"></script>
  <script src="js/deepgram-service.js"></script>
  
  <script>
    // Initialize DeepgramService with proxy
    const config = window.UniversiteConfig.getConfig();
    const deepgramService = new DeepgramService(config.DEEPGRAM.API_KEY, config.DEEPGRAM.MODEL);
    
    let mediaRecorder;
    let audioChunks = [];

    // Test connection
    async function testConnection() {
      const testBtn = document.getElementById('test-connection-btn');
      const statusDiv = document.getElementById('status');
      const detailsDiv = document.getElementById('details');
      
      testBtn.disabled = true;
      testBtn.textContent = 'Testing...';
      
      statusDiv.className = 'p-4 rounded bg-yellow-100 text-yellow-800';
      statusDiv.textContent = 'Testing Deepgram connection via proxy...';
      statusDiv.classList.remove('hidden');
      detailsDiv.classList.add('hidden');

      try {
        const result = await deepgramService.testConnection();
        
        if (result.success) {
          statusDiv.className = 'p-4 rounded bg-green-100 text-green-800';
          statusDiv.textContent = '✅ Deepgram connection successful via proxy!';
          
          detailsDiv.innerHTML = `
            <h3 class="font-bold mb-2">Connection Details:</h3>
            <p><strong>Status:</strong> ${result.status}</p>
            <p><strong>Message:</strong> ${result.message}</p>
            <p><strong>Models Available:</strong> ${result.models ? result.models.length : 'Unknown'}</p>
            <p><strong>Proxy Endpoint:</strong> ${deepgramService.transcribeEndpoint}</p>
          `;
          detailsDiv.classList.remove('hidden');
        } else {
          statusDiv.className = 'p-4 rounded bg-red-100 text-red-800';
          statusDiv.textContent = `❌ Connection failed: ${result.error}`;
          
          detailsDiv.innerHTML = `
            <h3 class="font-bold mb-2">Error Details:</h3>
            <p><strong>Error:</strong> ${result.error}</p>
            <p><strong>Proxy Endpoint:</strong> ${deepgramService.transcribeEndpoint}</p>
            <p><strong>Solution:</strong> Make sure Flask backend is running on port 5000</p>
          `;
          detailsDiv.classList.remove('hidden');
        }
        
      } catch (error) {
        console.error('Connection test error:', error);
        statusDiv.className = 'p-4 rounded bg-red-100 text-red-800';
        statusDiv.textContent = `❌ Test failed: ${error.message}`;
      }
      
      testBtn.disabled = false;
      testBtn.textContent = 'Test Deepgram Connection';
    }

    // Test transcription with sample audio
    async function testTranscription() {
      const testBtn = document.getElementById('test-transcription-btn');
      const statusDiv = document.getElementById('status');
      const detailsDiv = document.getElementById('details');
      
      testBtn.disabled = true;
      testBtn.textContent = 'Testing...';
      
      statusDiv.className = 'p-4 rounded bg-yellow-100 text-yellow-800';
      statusDiv.textContent = 'Testing transcription with sample audio...';
      statusDiv.classList.remove('hidden');
      detailsDiv.classList.add('hidden');

      try {
        // Create a silent audio file for testing
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const sampleRate = 16000;
        const duration = 2; // 2 seconds
        const buffer = audioContext.createBuffer(1, sampleRate * duration, sampleRate);
        
        // Convert to WAV
        const wav = audioBufferToWav(buffer);
        const blob = new Blob([wav], { type: 'audio/wav' });
        const audioFile = new File([blob], 'test.wav', { type: 'audio/wav' });
        
        const result = await deepgramService.transcribeAudio(audioFile, {
          language: 'en'
        });
        
        if (result.success) {
          statusDiv.className = 'p-4 rounded bg-green-100 text-green-800';
          statusDiv.textContent = '✅ Transcription test successful!';
          
          detailsDiv.innerHTML = `
            <h3 class="font-bold mb-2">Transcription Results:</h3>
            <p><strong>Transcript:</strong> "${result.transcript}"</p>
            <p><strong>Confidence:</strong> ${(result.confidence * 100).toFixed(1)}%</p>
            <p><strong>Duration:</strong> ${result.duration.toFixed(2)}s</p>
            <p><strong>Model:</strong> ${result.model}</p>
          `;
          detailsDiv.classList.remove('hidden');
        } else {
          statusDiv.className = 'p-4 rounded bg-red-100 text-red-800';
          statusDiv.textContent = `❌ Transcription failed: ${result.error}`;
          
          detailsDiv.innerHTML = `
            <h3 class="font-bold mb-2">Transcription Error:</h3>
            <p><strong>Error:</strong> ${result.error}</p>
          `;
          detailsDiv.classList.remove('hidden');
        }
        
      } catch (error) {
        console.error('Transcription test error:', error);
        statusDiv.className = 'p-4 rounded bg-red-100 text-red-800';
        statusDiv.textContent = `❌ Test failed: ${error.message}`;
      }
      
      testBtn.disabled = false;
      testBtn.textContent = 'Test Transcription';
    }

    // Recording functions
    async function startRecording() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];

        mediaRecorder.ondataavailable = (event) => {
          audioChunks.push(event.data);
        };

        mediaRecorder.onstop = async () => {
          const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
          await transcribeRecording(audioBlob);
        };

        mediaRecorder.start();
        
        document.getElementById('start-record-btn').disabled = true;
        document.getElementById('stop-record-btn').disabled = false;
        document.getElementById('recording-status').textContent = '🔴 Recording...';
        document.getElementById('recording-status').className = 'text-red-600 font-semibold';
        
      } catch (error) {
        console.error('Error starting recording:', error);
        alert('Error accessing microphone: ' + error.message);
      }
    }

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
        mediaRecorder.stream.getTracks().forEach(track => track.stop());
        
        document.getElementById('start-record-btn').disabled = false;
        document.getElementById('stop-record-btn').disabled = true;
        document.getElementById('recording-status').textContent = '⏹️ Recording stopped. Processing...';
        document.getElementById('recording-status').className = 'text-blue-600 font-semibold';
      }
    }

    async function transcribeRecording(audioBlob) {
      const resultDiv = document.getElementById('transcription-result');
      
      resultDiv.className = 'p-4 rounded bg-yellow-100 text-yellow-800';
      resultDiv.textContent = 'Transcribing recording...';
      resultDiv.classList.remove('hidden');

      try {
        const result = await deepgramService.transcribeFromBlob(audioBlob, {
          language: 'en'
        });

        if (result.success) {
          resultDiv.className = 'p-4 rounded bg-green-100 text-green-800';
          resultDiv.innerHTML = `
            <h3 class="font-bold mb-2">🎤 Live Transcription:</h3>
            <p><strong>Transcript:</strong> "${result.transcript}"</p>
            <p><strong>Confidence:</strong> ${(result.confidence * 100).toFixed(1)}%</p>
            <p><strong>Duration:</strong> ${result.duration.toFixed(2)}s</p>
          `;
        } else {
          resultDiv.className = 'p-4 rounded bg-red-100 text-red-800';
          resultDiv.innerHTML = `
            <h3 class="font-bold mb-2">❌ Transcription Failed:</h3>
            <p><strong>Error:</strong> ${result.error}</p>
          `;
        }
      } catch (error) {
        console.error('Transcription error:', error);
        resultDiv.className = 'p-4 rounded bg-red-100 text-red-800';
        resultDiv.innerHTML = `
          <h3 class="font-bold mb-2">❌ Transcription Error:</h3>
          <p><strong>Error:</strong> ${error.message}</p>
        `;
      }

      document.getElementById('recording-status').textContent = '';
    }

    // Helper function to convert AudioBuffer to WAV
    function audioBufferToWav(buffer) {
      const length = buffer.length * buffer.numberOfChannels * 2 + 44;
      const arrayBuffer = new ArrayBuffer(length);
      const view = new DataView(arrayBuffer);
      const channels = [];
      let offset = 0;
      let pos = 0;

      const setUint16 = (data) => {
        view.setUint16(pos, data, true);
        pos += 2;
      };
      const setUint32 = (data) => {
        view.setUint32(pos, data, true);
        pos += 4;
      };

      // WAV header
      setUint32(0x46464952);
      setUint32(length - 8);
      setUint32(0x45564157);
      setUint32(0x20746d66);
      setUint32(16);
      setUint16(1);
      setUint16(buffer.numberOfChannels);
      setUint32(buffer.sampleRate);
      setUint32(buffer.sampleRate * 2 * buffer.numberOfChannels);
      setUint16(buffer.numberOfChannels * 2);
      setUint16(16);
      setUint32(0x61746164);
      setUint32(length - pos - 4);

      for (let i = 0; i < buffer.numberOfChannels; i++) {
        channels.push(buffer.getChannelData(i));
      }

      while (pos < length) {
        for (let i = 0; i < buffer.numberOfChannels; i++) {
          let sample = Math.max(-1, Math.min(1, channels[i][offset]));
          sample = sample < 0 ? sample * 0x8000 : sample * 0x7FFF;
          view.setInt16(pos, sample, true);
          pos += 2;
        }
        offset++;
      }

      return arrayBuffer;
    }

    // Event listeners
    document.getElementById('test-connection-btn').addEventListener('click', testConnection);
    document.getElementById('test-transcription-btn').addEventListener('click', testTranscription);
    document.getElementById('start-record-btn').addEventListener('click', startRecording);
    document.getElementById('stop-record-btn').addEventListener('click', stopRecording);
  </script>
</body>
</html>
