<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Hugging Face Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen py-8">
    <div class="max-w-2xl mx-auto px-4">
        <div class="bg-white rounded-lg shadow-lg p-6">
            <h1 class="text-2xl font-bold text-gray-800 mb-6">Test Hugging Face Chat</h1>
            
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-2">Message</label>
                <textarea id="messageInput" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" 
                          rows="3" placeholder="Type your message here...">Hello! Can you help me with my studies?</textarea>
            </div>

            <button id="testButton" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition">
                Test Chat (No Auth)
            </button>

            <button id="testBackendButton" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 transition ml-2">
                Test Backend Health
            </button>

            <div id="loading" class="hidden mt-4">
                <div class="text-blue-600">Testing...</div>
            </div>

            <div id="results" class="hidden mt-4">
                <h3 class="font-semibold mb-2">Results:</h3>
                <div id="resultContent" class="p-4 bg-gray-50 rounded text-sm"></div>
            </div>

            <div id="error" class="hidden mt-4">
                <h3 class="font-semibold mb-2 text-red-600">Error:</h3>
                <div id="errorContent" class="p-4 bg-red-50 rounded text-red-700"></div>
            </div>
        </div>
    </div>

    <script>
        async function testBackendHealth() {
            showLoading();
            
            try {
                const response = await fetch('http://localhost:5000/health');
                
                if (response.ok) {
                    const data = await response.json();
                    showResults(`Backend Health: ${JSON.stringify(data, null, 2)}`);
                } else {
                    showError(`Backend Error: ${response.status} ${response.statusText}`);
                }
            } catch (error) {
                showError(`Network Error: ${error.message}`);
            }
        }

        async function testChat() {
            const message = document.getElementById('messageInput').value.trim();
            
            if (!message) {
                showError('Please enter a message');
                return;
            }

            showLoading();
            
            try {
                // Test the unauthenticated endpoint first
                const response = await fetch('http://localhost:5000/test-gemini', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: message
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    showResults(`Chat Response: ${JSON.stringify(data, null, 2)}`);
                } else {
                    const errorData = await response.text();
                    showError(`Chat Error: ${response.status} - ${errorData}`);
                }
            } catch (error) {
                showError(`Network Error: ${error.message}`);
            }
        }

        function showLoading() {
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('results').classList.add('hidden');
            document.getElementById('error').classList.add('hidden');
        }

        function showResults(content) {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('results').classList.remove('hidden');
            document.getElementById('error').classList.add('hidden');
            document.getElementById('resultContent').textContent = content;
        }

        function showError(message) {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('results').classList.add('hidden');
            document.getElementById('error').classList.remove('hidden');
            document.getElementById('errorContent').textContent = message;
        }

        // Setup event listeners
        document.getElementById('testButton').addEventListener('click', testChat);
        document.getElementById('testBackendButton').addEventListener('click', testBackendHealth);
        
        // Auto-test backend health on load
        window.addEventListener('load', testBackendHealth);
    </script>
</body>
</html>
