<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deepgram API Proxy Test</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-8">
  <div class="max-w-2xl mx-auto">
    <h1 class="text-2xl font-bold mb-6">Deepgram API Proxy Test</h1>
    
    <div class="bg-white rounded-lg shadow p-6">
      <div class="mb-4">
        <button id="test-proxy-btn" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
          Test Deepgram via Proxy
        </button>
        <button id="start-backend-btn" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 ml-2">
          Start Backend Server
        </button>
      </div>
      
      <div id="backend-status" class="mb-4 p-3 rounded bg-gray-100 text-sm">
        <strong>Backend Status:</strong> <span id="status-text">Unknown</span>
      </div>
      
      <div id="results" class="space-y-4">
        <div id="status" class="hidden p-4 rounded"></div>
        <div id="details" class="hidden bg-gray-50 p-4 rounded font-mono text-sm"></div>
      </div>
    </div>

    <!-- Transcription Test -->
    <div class="bg-white rounded-lg shadow p-6 mt-6">
      <h2 class="text-lg font-semibold mb-4">Audio Transcription Test</h2>
      
      <div class="mb-4">
        <input type="file" id="audio-file" accept="audio/*" class="border rounded p-2 w-full">
        <button id="transcribe-btn" class="bg-purple-600 text-white px-4 py-2 rounded hover:bg-purple-700 mt-2" disabled>
          Transcribe Audio
        </button>
      </div>
      
      <div id="transcription-result" class="hidden p-4 rounded"></div>
    </div>
  </div>

  <script>
    const BACKEND_URL = 'http://localhost:5000';
    
    // Check if backend is running
    async function checkBackendStatus() {
      const statusText = document.getElementById('status-text');
      const startBackendBtn = document.getElementById('start-backend-btn');
      
      try {
        const response = await fetch(`${BACKEND_URL}/api/deepgram/test`, {
          method: 'GET'
        });
        
        if (response.ok) {
          statusText.textContent = 'Running ✅';
          statusText.className = 'text-green-600';
          startBackendBtn.disabled = true;
          return true;
        } else {
          statusText.textContent = 'Error ❌';
          statusText.className = 'text-red-600';
          return false;
        }
      } catch (error) {
        statusText.textContent = 'Not running';
        statusText.className = 'text-red-600';
        return false;
      }
    }

    // Test Deepgram via proxy
    async function testDeepgramProxy() {
      const testBtn = document.getElementById('test-proxy-btn');
      const statusDiv = document.getElementById('status');
      const detailsDiv = document.getElementById('details');
      
      testBtn.disabled = true;
      testBtn.textContent = 'Testing...';
      
      statusDiv.className = 'p-4 rounded bg-yellow-100 text-yellow-800';
      statusDiv.textContent = 'Testing Deepgram API via proxy...';
      statusDiv.classList.remove('hidden');
      detailsDiv.classList.add('hidden');

      try {
        const response = await fetch(`${BACKEND_URL}/api/deepgram/test`, {
          method: 'GET'
        });

        const data = await response.json();
        
        if (data.success) {
          statusDiv.className = 'p-4 rounded bg-green-100 text-green-800';
          statusDiv.textContent = '✅ Deepgram API is reachable via proxy!';
          
          detailsDiv.innerHTML = `
            <h3 class="font-bold mb-2">Proxy Test Results:</h3>
            <p><strong>Status:</strong> ${response.status}</p>
            <p><strong>Message:</strong> ${data.message}</p>
            <p><strong>Models Available:</strong></p>
            <pre>${JSON.stringify(data.models, null, 2)}</pre>
          `;
          detailsDiv.classList.remove('hidden');
        } else {
          statusDiv.className = 'p-4 rounded bg-red-100 text-red-800';
          statusDiv.textContent = `❌ Proxy test failed: ${data.error}`;
          
          detailsDiv.innerHTML = `
            <h3 class="font-bold mb-2">Error Details:</h3>
            <p><strong>Error:</strong> ${data.error}</p>
            <p><strong>Status:</strong> ${response.status}</p>
          `;
          detailsDiv.classList.remove('hidden');
        }
        
      } catch (error) {
        console.error('Proxy test error:', error);
        
        statusDiv.className = 'p-4 rounded bg-red-100 text-red-800';
        statusDiv.textContent = `❌ Failed to connect to proxy: ${error.message}`;
        
        detailsDiv.innerHTML = `
          <h3 class="font-bold mb-2">Connection Error:</h3>
          <p><strong>Error:</strong> ${error.message}</p>
          <p><strong>Backend URL:</strong> ${BACKEND_URL}</p>
          <p><strong>Solution:</strong> Make sure the Flask backend is running on port 5000</p>
        `;
        detailsDiv.classList.remove('hidden');
      }
      
      testBtn.disabled = false;
      testBtn.textContent = 'Test Deepgram via Proxy';
    }

    // Transcribe audio file
    async function transcribeAudio() {
      const fileInput = document.getElementById('audio-file');
      const transcribeBtn = document.getElementById('transcribe-btn');
      const resultDiv = document.getElementById('transcription-result');
      
      if (!fileInput.files[0]) {
        alert('Please select an audio file first');
        return;
      }
      
      const formData = new FormData();
      formData.append('file', fileInput.files[0]);
      formData.append('model', 'nova-2');
      formData.append('language', 'en');
      
      transcribeBtn.disabled = true;
      transcribeBtn.textContent = 'Transcribing...';
      
      resultDiv.className = 'p-4 rounded bg-yellow-100 text-yellow-800';
      resultDiv.textContent = 'Transcribing audio file...';
      resultDiv.classList.remove('hidden');

      try {
        const response = await fetch(`${BACKEND_URL}/api/deepgram/transcribe`, {
          method: 'POST',
          body: formData
        });

        const data = await response.json();
        
        if (data.success) {
          resultDiv.className = 'p-4 rounded bg-green-100 text-green-800';
          resultDiv.innerHTML = `
            <h3 class="font-bold mb-2">✅ Transcription Successful!</h3>
            <p><strong>Transcript:</strong> ${data.transcript}</p>
            <p><strong>Confidence:</strong> ${(data.confidence * 100).toFixed(1)}%</p>
            <p><strong>Duration:</strong> ${data.duration.toFixed(2)}s</p>
          `;
        } else {
          resultDiv.className = 'p-4 rounded bg-red-100 text-red-800';
          resultDiv.innerHTML = `
            <h3 class="font-bold mb-2">❌ Transcription Failed</h3>
            <p><strong>Error:</strong> ${data.error}</p>
          `;
        }
        
      } catch (error) {
        console.error('Transcription error:', error);
        resultDiv.className = 'p-4 rounded bg-red-100 text-red-800';
        resultDiv.innerHTML = `
          <h3 class="font-bold mb-2">❌ Transcription Error</h3>
          <p><strong>Error:</strong> ${error.message}</p>
        `;
      }
      
      transcribeBtn.disabled = false;
      transcribeBtn.textContent = 'Transcribe Audio';
    }

    // Start backend server
    function startBackend() {
      const statusDiv = document.getElementById('status');
      const detailsDiv = document.getElementById('details');
      
      statusDiv.className = 'p-4 rounded bg-blue-100 text-blue-800';
      statusDiv.textContent = 'Starting backend server...';
      statusDiv.classList.remove('hidden');
      
      detailsDiv.innerHTML = `
        <h3 class="font-bold mb-2">To start the backend server:</h3>
        <ol class="list-decimal list-inside space-y-2">
          <li>Open Command Prompt or PowerShell</li>
          <li>Navigate to your project directory: <code>cd d:\\universite</code></li>
          <li>Run the Flask server: <code>python api.py</code></li>
          <li>Wait for the server to start (you should see "Running on http://127.0.0.1:5000")</li>
          <li>Click "Test Deepgram via Proxy" again</li>
        </ol>
        <p class="mt-2 text-sm">The server will run in the foreground - keep that terminal window open.</p>
      `;
      detailsDiv.classList.remove('hidden');
    }

    // Event listeners
    document.getElementById('test-proxy-btn').addEventListener('click', testDeepgramProxy);
    document.getElementById('start-backend-btn').addEventListener('click', startBackend);
    document.getElementById('transcribe-btn').addEventListener('click', transcribeAudio);
    
    // Enable transcribe button when file is selected
    document.getElementById('audio-file').addEventListener('change', (e) => {
      const transcribeBtn = document.getElementById('transcribe-btn');
      transcribeBtn.disabled = !e.target.files[0];
    });

    // Check backend status on page load
    checkBackendStatus();
    setInterval(checkBackendStatus, 5000); // Check every 5 seconds
  </script>
</body>
</html>
