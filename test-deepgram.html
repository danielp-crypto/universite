<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deepgram API Test</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-8">
  <div class="max-w-2xl mx-auto">
    <h1 class="text-2xl font-bold mb-6">Deepgram API Connection Test</h1>
    
    <div class="bg-white rounded-lg shadow p-6">
      <div class="mb-4">
        <button id="test-btn" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
          Test Deepgram API Connection
        </button>
      </div>
      
      <div id="results" class="space-y-4">
        <div id="status" class="hidden p-4 rounded"></div>
        <div id="details" class="hidden bg-gray-50 p-4 rounded font-mono text-sm"></div>
      </div>
    </div>
  </div>

  <script>
    const config = {
      FLASK_API: {
        BASE_URL: 'http://localhost:5000',
        DEEPGRAM_TEST_ENDPOINT: '/api/deepgram/test',
        DEEPGRAM_TRANSCRIBE_ENDPOINT: '/api/deepgram/transcribe'
      }
    };

    async function testDeepgramAPI() {
      const testBtn = document.getElementById('test-btn');
      const statusDiv = document.getElementById('status');
      const detailsDiv = document.getElementById('details');
      
      testBtn.disabled = true;
      testBtn.textContent = 'Testing...';
      
      statusDiv.className = 'p-4 rounded bg-yellow-100 text-yellow-800';
      statusDiv.textContent = 'Testing connection to Deepgram API...';
      statusDiv.classList.remove('hidden');
      detailsDiv.classList.add('hidden');

      try {
        // Test 1: Basic connectivity check through Flask proxy
        console.log('Testing Flask proxy to Deepgram API...');
        const response = await fetch(`${config.FLASK_API.BASE_URL}${config.FLASK_API.DEEPGRAM_TEST_ENDPOINT}`, {
          method: 'GET',
          headers: {
            'Content-Type': 'application/json'
          }
        });

        console.log('Response status:', response.status);
        console.log('Response headers:', [...response.headers.entries()]);

        if (response.ok) {
          const data = await response.json();
          
          statusDiv.className = 'p-4 rounded bg-green-100 text-green-800';
          statusDiv.textContent = '✅ Flask proxy to Deepgram API is working!';
          
          detailsDiv.innerHTML = `
            <h3 class="font-bold mb-2">Connection Details:</h3>
            <p><strong>Status:</strong> ${response.status}</p>
            <p><strong>Proxy URL:</strong> ${config.FLASK_API.BASE_URL}${config.FLASK_API.DEEPGRAM_TEST_ENDPOINT}</p>
            <p><strong>Response:</strong></p>
            <pre>${JSON.stringify(data, null, 2)}</pre>
          `;
          detailsDiv.classList.remove('hidden');
          
        } else {
          const errorText = await response.text();
          throw new Error(`HTTP ${response.status}: ${errorText}`);
        }

      } catch (error) {
        console.error('Deepgram API test failed:', error);
        
        statusDiv.className = 'p-4 rounded bg-red-100 text-red-800';
        
        if (error.name === 'TypeError' && error.message.includes('fetch')) {
          statusDiv.textContent = '❌ Network error - Cannot reach Flask server. Make sure it\'s running on port 5000.';
        } else if (error.message.includes('401')) {
          statusDiv.textContent = '❌ Authentication failed - Invalid API key.';
        } else if (error.message.includes('403')) {
          statusDiv.textContent = '❌ Access forbidden - API key may not have proper permissions.';
        } else {
          statusDiv.textContent = `❌ Error: ${error.message}`;
        }
        
        detailsDiv.innerHTML = `
          <h3 class="font-bold mb-2">Error Details:</h3>
          <p><strong>Error:</strong> ${error.name}</p>
          <p><strong>Message:</strong> ${error.message}</p>
          <p><strong>Proxy URL:</strong> ${config.FLASK_API.BASE_URL}${config.FLASK_API.DEEPGRAM_TEST_ENDPOINT}</p>
          <p><strong>Flask Server:</strong> Make sure it's running on port 5000</p>
        `;
        detailsDiv.classList.remove('hidden');
      }
      
      testBtn.disabled = false;
      testBtn.textContent = 'Test Deepgram API Connection';
    }

    // Test transcription with a small audio blob
    async function testTranscription() {
      console.log('Testing transcription capability...');
      
      // Create a simple audio blob (silent audio for testing)
      const audioContext = new (window.AudioContext || window.webkitAudioContext)();
      const sampleRate = 16000;
      const duration = 1; // 1 second
      const buffer = audioContext.createBuffer(1, sampleRate * duration, sampleRate);
      
      // Convert to WAV blob
      const wav = audioBufferToWav(buffer);
      const blob = new Blob([wav], { type: 'audio/wav' });
      
      try {
        const formData = new FormData();
        formData.append('file', blob, 'test.wav');
        formData.append('model', 'nova-2');
        formData.append('language', 'en');

        const response = await fetch(`${config.FLASK_API.BASE_URL}${config.FLASK_API.DEEPGRAM_TRANSCRIBE_ENDPOINT}`, {
          method: 'POST',
          body: formData
        });

        if (response.ok) {
          const result = await response.json();
          console.log('Transcription test result:', result);
          return true;
        } else {
          throw new Error(`Transcription test failed: ${response.status}`);
        }
      } catch (error) {
        console.error('Transcription test error:', error);
        return false;
      }
    }

    // Helper function to convert AudioBuffer to WAV
    function audioBufferToWav(buffer) {
      const length = buffer.length * buffer.numberOfChannels * 2 + 44;
      const arrayBuffer = new ArrayBuffer(length);
      const view = new DataView(arrayBuffer);
      const channels = [];
      let offset = 0;
      let pos = 0;

      // Write WAV header
      const setUint16 = (data) => {
        view.setUint16(pos, data, true);
        pos += 2;
      };
      const setUint32 = (data) => {
        view.setUint32(pos, data, true);
        pos += 4;
      };

      // RIFF identifier
      setUint32(0x46464952);
      // file length
      setUint32(length - 8);
      // WAVE identifier
      setUint32(0x45564157);
      // fmt chunk identifier
      setUint32(0x20746d66);
      // chunk length
      setUint32(16);
      // sample format (PCM)
      setUint16(1);
      // channel count
      setUint16(buffer.numberOfChannels);
      // sample rate
      setUint32(buffer.sampleRate);
      // byte rate
      setUint32(buffer.sampleRate * 2 * buffer.numberOfChannels);
      // block align
      setUint16(buffer.numberOfChannels * 2);
      // bits per sample
      setUint16(16);
      // data chunk identifier
      setUint32(0x61746164);
      // data length
      setUint32(length - pos - 4);

      // Write audio data
      for (let i = 0; i < buffer.numberOfChannels; i++) {
        channels.push(buffer.getChannelData(i));
      }

      while (pos < length) {
        for (let i = 0; i < buffer.numberOfChannels; i++) {
          let sample = Math.max(-1, Math.min(1, channels[i][offset]));
          sample = sample < 0 ? sample * 0x8000 : sample * 0x7FFF;
          view.setInt16(pos, sample, true);
          pos += 2;
        }
        offset++;
      }

      return arrayBuffer;
    }

    document.getElementById('test-btn').addEventListener('click', testDeepgramAPI);
  </script>
</body>
</html>
